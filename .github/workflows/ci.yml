name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The default shallow clone fetches one commit, and one of the tests
          # reads the author of every commit to catch an identity that credits
          # a stranger. At depth 1 that test inspects a single commit and
          # passes on a history full of them. 64 commits cost nothing to fetch.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: pytest tests/ -v

      - name: Audit dependencies for known CVEs
        # Twenty phases shipped with three pinned dependencies and nothing
        # checking whether any of them had a published CVE. Pinning makes the
        # build reproducible; it also means the versions never move on their
        # own, so a reproducible build is a photograph of a state that ages.
        # aiohttp carries every outbound request this project makes and has a
        # real history of CVEs. pip-audit is PyPA's, queries the OSV database,
        # and lives in CI — it adds nothing to requirements.txt.
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

  docker:
    name: docker build & run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t vigil-sre .

      - name: Verify the image can import every entrypoint it ships
        # A `docker build` succeeding proves nothing about whether the app can
        # start -- a build that COPYs three of six modules is a perfectly
        # successful build, and this step is what catches it. Every entrypoint
        # is named, not just main: an earlier revision shipped an image that
        # could not import notifiers, api or dashboard while `import main`
        # alone was the whole check.
        run: |
          docker run --rm --entrypoint python vigil-sre -c "import main; print('main OK')"
          docker run --rm --entrypoint python vigil-sre -c "import api, dashboard, notifiers; print('api OK')"

      - name: Run one real health-check cycle end-to-end
        # Exercises the actual deployment path (docker-compose.yml, the real
        # targets.yaml smoke-test targets, state.json/history.db writes) —
        # not just an import. main.py exits 0 regardless of target status
        # unless --strict is passed, so this only fails on an unhandled crash.
        run: |
          cp .env.example .env
          # compose refuses to render without this, on purpose: a shared
          # SECRET_KEY in a public repo lets anyone forge a session for the
          # watchdog's demo user. CI gets a throwaway one per run rather than
          # a literal committed anywhere -- the guard stays strict and this
          # job still exercises the real deployment path.
          echo "WATCHDOG_SECRET_KEY=$(openssl rand -hex 32)" >> .env
          echo '{}' > state.json
          : > history.db
          docker compose build
          docker compose run --rm health-checker python main.py
