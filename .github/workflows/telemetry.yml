name: telemetry

# Two weeks of probe history, collected without leaving a laptop on.
#
# The trend comparison needs two full windows: the last seven days against the
# seven before them. A burst of manual runs cannot produce that — the earlier
# window is time that had to be measured while it was happening.
#
# Read this before trusting the numbers. These runners live in GitHub's
# datacenters, so what gets recorded is GITHUB's path to each target, not
# yours. That makes it a consistent vantage point, which is what validates the
# feature end to end on real history. It is not your network, so thresholds
# calibrated here do not transfer to a laptop on a home connection — for that,
# the manual runs are the source.
#
# Hourly, not half-hourly: 336 runs over two weeks is 168 samples per window
# per target, against the 20 the comparison needs. Eight times the requirement
# at half the runner time. More samples would buy nothing and cost twice.
#
# Actions minutes are free and unlimited on public repositories; the 2,000/month
# cap applies to private ones. The guards below exist anyway — a collector that
# outlives its purpose is exactly the kind of thing nobody notices.

on:
  schedule:
    # :17, not :00. GitHub's scheduler is best-effort — runs get delayed under
    # load and are occasionally skipped — and :00 is the minute every hourly
    # cron in the world is written on, so it starts each hour with the longest
    # queue of the day. Measured here on the first eight hours at "0 * * * *":
    #
    #   17:30  19:11  20:49  21:54  22:45  23:55  01:15
    #
    # Not one landed on the hour, the median delay was ~50 minutes, and 18:00
    # never ran at all. A delay costs nothing (the goal is samples spread
    # across every hour, not a metronome) but a skip costs a sample, and skips
    # get likelier the longer the queue. An odd minute competes with nobody.
    #
    # This does NOT shift the collection window: both ends are compared against
    # the absolute timestamps in COLLECT_FROM/COLLECT_UNTIL, not the cron.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write           # push collected rows
  actions:  write           # switch itself off when the window closes

concurrency:
  # Two runs appending to the same file would race on the push. Queue rather
  # than cancel: a cancelled run is a lost sample, and samples are the point.
  group: telemetry
  cancel-in-progress: false

env:
  # The window, both ends, to the minute. A bare date leaves "the 17th"
  # ambiguous — does it start or end that day — and an unattended job is
  # exactly where an ambiguity gets resolved the wrong way for two weeks.
  # Compared as strings, which is correct because ISO-8601 sorts
  # lexicographically; the test asserts that property rather than trusting it.
  COLLECT_FROM:  "2026-08-03T15:00:00Z"
  COLLECT_UNTIL: "2026-08-17T15:00:00Z"
  DATA_BRANCH: telemetry

jobs:
  probe:
    runs-on: ubuntu-latest
    # A stuck run cannot burn the 6-hour default. Nothing here legitimately
    # takes more than two minutes; ten is slack, not a budget.
    timeout-minutes: 10

    steps:
      # ---------------------------------------------------------------------
      # Gate. Decides BEFORE any work whether this run should happen at all.
      # ---------------------------------------------------------------------
      - name: Is the collection window still open?
        id: window
        run: |
          NOW=$(date -u +%FT%TZ)
          if [[ "$NOW" > "$COLLECT_UNTIL" ]]; then
            echo "expired=true" >> "$GITHUB_OUTPUT"
            echo "La ventana cerro el $COLLECT_UNTIL (ahora: $NOW). No se sondea."
          elif [[ "$NOW" < "$COLLECT_FROM" ]]; then
            # Guards the other end too: a fork, a re-enable, or a clock that
            # disagrees must not start collecting outside the window either.
            echo "expired=false" >> "$GITHUB_OUTPUT"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "La ventana abre el $COLLECT_FROM (ahora: $NOW). Todavia no."
          else
            echo "expired=false" >> "$GITHUB_OUTPUT"
            echo "Recolectando: $COLLECT_FROM -> $COLLECT_UNTIL (ahora: $NOW)."
          fi

      - uses: actions/checkout@v7
        if: steps.window.outputs.expired == 'false' && steps.window.outputs.skip != 'true'

      - uses: actions/setup-python@v7
        if: steps.window.outputs.expired == 'false' && steps.window.outputs.skip != 'true'
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.window.outputs.expired == 'false' && steps.window.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Probe once
        if: steps.window.outputs.expired == 'false' && steps.window.outputs.skip != 'true'
        # No webhooks configured, so nothing is dispatched anywhere: the
        # collector measures, it does not page. `|| true` because main.py
        # exiting non-zero on a genuinely lost alert would cost the sample it
        # just took, and the sample is the only reason this job exists.
        run: |
          cp .env.example .env
          python main.py || true

      - name: Append the new rows
        if: steps.window.outputs.expired == 'false' && steps.window.outputs.skip != 'true'
        run: |
          # The official GitHub Actions bot identity, numeric ID included.
          # `<name>@users.noreply.github.com` is GitHub's hidden-email format,
          # so any word there RESOLVES TO THE REAL ACCOUNT WITH THAT USERNAME:
          # "telemetry@users.noreply.github.com" credited these commits to a
          # stranger called telemetry and listed them as a contributor to this
          # repo. Attribution is not cosmetic — it says who did the work.
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # ORDER MATTERS, and it is the whole point of this step.
          #
          # An orphan branch holds ONE file. Checking it out therefore DELETES
          # the source tree from the working directory -- including
          # scripts/export-history.py, the thing that has to run. Runs #4-#9
          # died exactly there, one per hour, with "No such file or directory",
          # and run #3 passed because the branch did not exist yet: the very
          # first run creates it and every run after it hits the deletion.
          #
          # So everything that needs the source tree happens BEFORE any
          # checkout, and the data branch is read without switching to it.
          if git fetch origin "$DATA_BRANCH" --depth=1 2>/dev/null; then
            HAVE_BRANCH=1
            # `git show ref:path` reads a file out of a commit without touching
            # the working tree. That is what makes the ordering possible.
            LAST=$(git show "origin/$DATA_BRANCH:telemetry/github-actions.ndjson" 2>/dev/null \
              | tail -n 1 \
              | python -c 'import json,sys; s=sys.stdin.read().strip(); print(json.loads(s)["checked_at"] if s else "")')
          else
            HAVE_BRANCH=0
            LAST=""
          fi

          # Exported while the source tree still exists. Only rows newer than
          # what is stored: re-exporting everything would rewrite the whole
          # file, and git would keep a full copy of it every hour.
          # No heredoc: its terminator has to sit at column 0, which breaks
          # out of this YAML block scalar and makes the whole file unparseable.
          if [ -n "$LAST" ]; then
            python scripts/export-history.py --source github-actions \
              --since "$LAST" > /tmp/new.ndjson
          else
            python scripts/export-history.py --source github-actions > /tmp/new.ndjson
          fi
          echo "  filas exportadas en esta corrida: $(wc -l < /tmp/new.ndjson)"

          # Only now, with the rows safely outside the repo, switch branches.
          if [ "$HAVE_BRANCH" = 1 ]; then
            git checkout "$DATA_BRANCH"
          else
            git checkout --orphan "$DATA_BRANCH"
            # --orphan keeps the index of the branch it came from, so the
            # first commit would carry the whole source tree onto a branch
            # meant to hold one data file. Clearing it is what makes
            # "orphan" mean what it says.
            git rm -rf --cached . > /dev/null
          fi

          mkdir -p telemetry
          touch telemetry/github-actions.ndjson

          # --since is inclusive, so the boundary row is already stored. With an
          # empty pattern file grep matches nothing and -v lets every line
          # through, which is exactly right on the first run.
          grep -vxF -f telemetry/github-actions.ndjson /tmp/new.ndjson \
            >> telemetry/github-actions.ndjson || true

          echo "  filas acumuladas: $(wc -l < telemetry/github-actions.ndjson)"
          # -f because telemetry/ is in .gitignore, and the runner carries that
          # .gitignore here: the orphan branch starts from main's working tree.
          # Both rules are right and they collide. On main the pattern stops a
          # broad `git add` from sweeping collected data into the source branch
          # -- the leak that mixed a laptop's measurements with a datacenter's.
          # On THIS branch that file is the entire point. The -f names one exact
          # path, so it overrides the rule for the file the rule is not about
          # and leaves the protection against sweeps intact. Without it the run
          # probes, exports, and then dies on `git add` with the data in hand.
          git add -f telemetry/github-actions.ndjson
          git diff --cached --quiet && echo "  sin filas nuevas" && exit 0
          git commit -m "telemetry: $(date -u +%FT%TZ)"
          git push origin "$DATA_BRANCH"

      # ---------------------------------------------------------------------
      # The finally. Runs whatever happened above — success, failure, timeout,
      # cancellation. A self-terminating collector that only terminates on the
      # happy path is one that runs forever the first time something breaks.
      # ---------------------------------------------------------------------
      - name: Switch off once the window has closed
        if: always()
        continue-on-error: true     # a failure here must not mask the real result
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOW=$(date -u +%FT%TZ)
          if [[ "$NOW" > "$COLLECT_UNTIL" ]]; then
            echo "Desactivando el schedule: la ventana cerro el $COLLECT_UNTIL."
            gh api -X PUT \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/telemetry.yml/disable" \
              && echo "  desactivado" \
              || echo "  no se pudo desactivar por API — desactivalo a mano en Actions"
          fi
