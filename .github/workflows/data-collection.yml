name: data-collection

# Fourteen days of probe history from GitHub's runners, without leaving a
# laptop on. Once an hour the monitor probes the fixed list in
# collection-targets.yaml and the new rows are appended, as NDJSON, to the
# `collected-data` branch. The history page, the daily summaries and the
# Grafana dashboards read the result after scripts/import-history.py.
#
# Read this before trusting the numbers: the runners live in GitHub's
# datacenters, so what is measured is GitHub's path to each target, not yours.
# Thresholds calibrated here describe that vantage point.
#
# Cost: Actions minutes are free and unlimited for public repositories. One run
# is about a minute; the window and the switch-off below keep it from
# outliving its purpose anyway.

on:
  schedule:
    # :17, not :00. The scheduler is best-effort and :00 is when every hourly
    # cron in the world starts, so runs queue longest and get skipped most then.
    # The window below is checked against absolute timestamps, not the cron.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write           # push collected rows to the data branch
  actions:  write           # switch itself off when the window closes

concurrency:
  group: data-collection
  cancel-in-progress: false

env:
  COLLECT_FROM:  "2026-10-18T14:00:00Z"
  COLLECT_UNTIL: "2026-11-01T14:00:00Z"
  DATA_BRANCH: collected-data
  DATA_FILE: collected/github-actions.ndjson
  STATE_FILE_PATH: data/state.json
  HISTORY_DB_PATH: data/history/history.db

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Is the collection window open?
        id: window
        run: |
          NOW=$(date -u +%FT%TZ)
          if [[ "$NOW" > "$COLLECT_UNTIL" ]]; then
            echo "expired=true" >> "$GITHUB_OUTPUT"
            echo "The window closed on $COLLECT_UNTIL (now: $NOW). Not probing."
          elif [[ "$NOW" < "$COLLECT_FROM" ]]; then
            echo "expired=false" >> "$GITHUB_OUTPUT"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "The window opens on $COLLECT_FROM (now: $NOW). Not yet."
          else
            echo "expired=false" >> "$GITHUB_OUTPUT"
            echo "Collecting: $COLLECT_FROM -> $COLLECT_UNTIL (now: $NOW)."
          fi

      - uses: actions/checkout@v7
        if: steps.window.outputs.expired == 'false' && steps.window.outputs.skip != 'true'

      - uses: actions/setup-python@v7
        if: steps.window.outputs.expired == 'false' && steps.window.outputs.skip != 'true'
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.window.outputs.expired == 'false' && steps.window.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Probe once
        if: steps.window.outputs.expired == 'false' && steps.window.outputs.skip != 'true'
        # No channels on purpose. Every run starts with no state, so every DOWN
        # target is a first sighting and would alert; blank webhooks make that
        # "no channels configured" instead of a POST to the placeholder in
        # .env.example. The round's exit code is not the job's verdict here:
        # an alert reaching nobody is expected, the rows are what matters.
        env:
          DISCORD_WEBHOOK_URL: ""
          SLACK_WEBHOOK_URL: ""
          HEARTBEAT_URL: ""
        run: |
          cp collection-targets.yaml targets.yaml
          python main.py || true

      - name: Append the new rows
        if: steps.window.outputs.expired == 'false' && steps.window.outputs.skip != 'true'
        run: |
          # The bot's own identity, and only that one. GitHub credits a commit
          # made as `<name>@users.noreply.github.com` to the account called
          # <name>; a collector that once committed under an ordinary word as the
          # name put a stranger's account among this repository's contributors.
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Read the last collected timestamp WITHOUT checking the branch out:
          # the data branch holds one file, so checking it out first would
          # delete scripts/ before the export below could run.
          if git fetch origin "$DATA_BRANCH" --depth=1 2>/dev/null; then
            HAVE_BRANCH=1
            LAST=$(git show "origin/$DATA_BRANCH:$DATA_FILE" 2>/dev/null \
              | tail -n 1 \
              | python -c 'import json,sys; s=sys.stdin.read().strip(); print(json.loads(s)["checked_at"] if s else "")')
          else
            HAVE_BRANCH=0
            LAST=""
          fi

          if [ -n "$LAST" ]; then
            python scripts/export-history.py --source github-actions --since "$LAST" > /tmp/new.ndjson
          else
            python scripts/export-history.py --source github-actions > /tmp/new.ndjson
          fi
          echo "  rows exported in this run: $(wc -l < /tmp/new.ndjson)"

          # Probe once replaced this tracked file. The export is safe in /tmp;
          # restore the input before switching to a branch that deletes it.
          # Otherwise every run after the first aborts on local changes.
          git restore -- targets.yaml

          if [ "$HAVE_BRANCH" = 1 ]; then
            git checkout "$DATA_BRANCH"
          else
            git checkout --orphan "$DATA_BRANCH"
            git rm -rf --cached . > /dev/null
          fi
          mkdir -p "$(dirname "$DATA_FILE")"
          touch "$DATA_FILE"
          grep -vxF -f "$DATA_FILE" /tmp/new.ndjson >> "$DATA_FILE" || true
          echo "  rows accumulated: $(wc -l < "$DATA_FILE")"
          git add -f "$DATA_FILE"
          git diff --cached --quiet && echo "  no new rows" && exit 0
          git commit -m "collected data: $(date -u +%FT%TZ)"
          git push origin "$DATA_BRANCH"

      - name: Switch off once the window has closed
        if: always()
        continue-on-error: true     # a failure here must not mask the real result
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOW=$(date -u +%FT%TZ)
          if [[ "$NOW" > "$COLLECT_UNTIL" ]]; then
            echo "Disabling the schedule: the window closed on $COLLECT_UNTIL."
            gh api -X PUT \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/data-collection.yml/disable" \
              && echo "  disabled" \
              || echo "  could not disable it through the API — disable it by hand in Actions"
          fi
